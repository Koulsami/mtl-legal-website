<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found | MTL Legal LLP — Advocates</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .notfound {
    min-height: 100vh;
    display: grid;
    place-items: center;
    text-align: center;
    background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-700) 100%);
    color: rgba(255, 255, 255, 0.78);
    padding: 40px 24px;
  }
  .notfound img { height: 62px; width: auto; margin: 0 auto 34px; }
  .notfound h1 { color: #fff; margin-bottom: 16px; }
  .notfound p { max-width: 460px; margin-inline: auto; }
  .notfound .btn { margin-top: 32px; }
  .notfound .eyebrow { color: var(--brass-soft); }
  .notfound .eyebrow::before { display: none; }
</style>
</head>
<body>
<main class="notfound">
  <div>
    <img src="/assets/img/mtl-logo-light.png" alt="MTL Legal LLP — Advocates">
    <span class="eyebrow" style="text-align:center">Error 404</span>
    <h1>This page could not be found</h1>
    <p>
      The page you were looking for may have been moved or is no longer available.
      Please return to the homepage or get in touch with us directly.
    </p>
    <a class="btn btn--light" href="/">Back to Homepage</a>
