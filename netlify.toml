# MTL Legal LLP — static site, no build step.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"


# Fingerprint-free assets, so keep the window moderate rather than immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Netlify publishes the repository root, so the README would otherwise be
# readable at /README.md. It is internal documentation, not site content.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
