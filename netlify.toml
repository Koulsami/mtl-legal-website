# MTL Legal LLP — static site, no build step.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

    # ------------------------------------------------------------------
    # STAGING ONLY — DELETE THIS LINE BEFORE GOING LIVE.
    # The contact email and telephone on contact.html are placeholders, so
    # search engines are kept away until the firm's real details are in and
    # the site is on its own domain. Removing this line is what makes the
    # site indexable. robots.txt deliberately still allows crawling: a
    # noindex header only works if the crawler is permitted to read it.
    # ------------------------------------------------------------------
    X-Robots-Tag = "noindex, nofollow"

# Fingerprint-free assets, so keep the window moderate rather than immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Netlify publishes the repository root, so the README would otherwise be
# readable at /README.md. It is internal documentation, not site content.
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
